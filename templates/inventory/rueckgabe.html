{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-8">
<h3 class="mb-3">{{ titel }}</h3>
<div class="card shadow-sm"><div class="card-body">
<form method="post">{% csrf_token %}
  <table class="table table-sm align-middle mb-3">
    <thead><tr><th>Gegenstand</th><th>Zustand bei Rückgabe</th><th>Kaution</th></tr></thead>
    <tbody>
    {% for v in positionen %}
      <tr>
        <td>{{ v.gegenstand.bezeichnung }}<br><span class="text-muted small">{{ v.gegenstand.inventarnummer }}</span></td>
        <td>
          <select name="zustand_{{ v.pk }}" class="form-select form-select-sm">
            {% for wert, label in zustand_choices %}
              <option value="{{ wert }}" {% if wert == v.gegenstand.zustand %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </td>
        <td>
          {% if v.kaution %}
          <select name="kaution_{{ v.pk }}" class="form-select form-select-sm">
            <option value="zurueckzahlen">Zurückzahlen ({{ v.kaution }} €)</option>
            <option value="einbehalten">Einbehalten (auf Rechnung)</option>
          </select>
          {% else %}
          <span class="text-muted">–</span>
          {% endif %}
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <button class="btn btn-primary">Rückgabe buchen</button>
  <a href="{{ abbrechen_url }}" class="btn btn-outline-secondary">Abbrechen</a>
</form>
</div></div>
</div></div>
{% endblock %}
