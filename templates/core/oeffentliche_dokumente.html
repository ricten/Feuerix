{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<h3 class="mb-3">Downloads – {{ verein.name }}</h3>
<div class="card shadow-sm"><div class="list-group list-group-flush">
  {% for d in dokumente %}
    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
       href="{% url 'oeffentliches_dokument_download' verein.kuerzel d.pk %}">
      <span>{{ d.titel }}<br><small class="text-muted">{{ d.get_kategorie_display }}</small></span>
      <span class="btn btn-sm btn-outline-primary">Herunterladen</span>
    </a>
  {% empty %}
    <div class="list-group-item text-muted">Aktuell sind keine öffentlichen Dokumente hinterlegt.</div>
  {% endfor %}
</div></div>
<p class="mt-3"><a href="{% url 'impressum' verein.kuerzel %}">Impressum</a></p>
</div></div>
{% endblock %}
