{% extends "base.html" %}
{% load i18n %}
{% block content %}
<a href="{% url 'hilfe' %}" class="text-decoration-none small d-block mb-1"><i class="bi bi-arrow-left"></i> {% trans "Hilfe" %}</a>
<div class="row">
  <div class="col-lg-3 mb-3">
    <div class="card shadow-sm"><div class="list-group list-group-flush">
      {% for d in dokumente %}
      <a class="list-group-item list-group-item-action {% if d.aktiv %}active{% endif %}"
         href="{% url 'hilfe_dokument' d.slug %}">{{ d.titel }}</a>
      {% endfor %}
    </div></div>
  </div>
  <div class="col-lg-9">
    <div class="card shadow-sm"><div class="card-body hilfe-inhalt">
      {{ inhalt_html|safe }}
    </div></div>
  </div>
</div>
<style>
  .hilfe-inhalt table { width: 100%; margin-bottom: 1rem; }
  .hilfe-inhalt table, .hilfe-inhalt th, .hilfe-inhalt td { border: 1px solid #dee2e6; border-collapse: collapse; }
  .hilfe-inhalt th, .hilfe-inhalt td { padding: .4rem .6rem; }
  .hilfe-inhalt code { background: #f1f3f5; padding: .1rem .3rem; border-radius: .25rem; }
  .hilfe-inhalt pre code { display: block; padding: .75rem; overflow-x: auto; }
  .hilfe-inhalt blockquote { border-left: 3px solid var(--bs-primary); padding-left: 1rem; color: #555; }
  .hilfe-inhalt h1, .hilfe-inhalt h2 { margin-top: 1.5rem; }
</style>
{% endblock %}
