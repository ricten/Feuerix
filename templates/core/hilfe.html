{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h3 class="mb-3"><i class="bi bi-question-circle" style="color: var(--bs-primary);"></i> {% trans "Hilfe" %}</h3>
<p class="text-muted">{% trans "Handbuch und weitere Anleitungen – direkt aus der Weboberfläche." %}</p>
<div class="card shadow-sm"><div class="list-group list-group-flush">
  {% for d in dokumente %}
  <a class="list-group-item list-group-item-action" href="{% url 'hilfe_dokument' d.slug %}">{{ d.titel }}</a>
  {% endfor %}
</div></div>
{% endblock %}
