{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
  <h4 class="mb-3"><i class="bi bi-shield-lock me-1"></i>{% trans "Zwei-Faktor-Anmeldung" %}</h4>
  <p class="text-muted small">{% trans "Geben Sie den 6-stelligen Code Ihrer Authenticator-App ein - oder einen Ihrer Wiederherstellungscodes." %}</p>
  {% if fehler %}<div class="alert alert-danger">{{ fehler }}</div>{% endif %}
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3"><input name="code" class="form-control form-control-lg text-center" autocomplete="one-time-code" autofocus required></div>
    <button class="btn btn-primary w-100">{% trans "Bestätigen" %}</button>
  </form>
</div></div></div></div>
{% endblock %}
