{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow-sm border-danger"><div class="card-body">
  <h4>{{ titel }}</h4>
  <p>{% blocktrans %}Möchten Sie <strong>{{ object }}</strong> wirklich löschen? Die Löschung wird im Änderungsprotokoll festgehalten.{% endblocktrans %}</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger"><i class="bi bi-trash"></i> {% trans "Endgültig löschen" %}</button>
    <a class="btn btn-outline-secondary" href="{{ liste_url }}"><i class="bi bi-x-lg"></i> {% trans "Abbrechen" %}</a>
  </form>
</div></div></div></div>
{% endblock %}
