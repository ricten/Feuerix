{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-4">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3"><i class="bi bi-box-arrow-in-right me-1"></i>Anmeldung</h4>
    {% if form.errors %}<div class="alert alert-danger">Benutzername oder Passwort falsch.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label">Benutzername</label><input name="username" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label">Passwort</label><input name="password" type="password" class="form-control" required></div>
      <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Anmelden</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
